# ============================================================
# Chạy agent + redis bằng một lệnh:
#   cp .env.example .env     # rồi đặt AGENT_API_KEY thật (không bắt buộc để compose chạy)
#   docker compose up --build
# Test:
#   curl -H "X-API-Key: $AGENT_API_KEY" -H "Content-Type: application/json" \
#        -d '{"question":"Hello"}' http://localhost:8000/ask
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    # Đọc thêm biến từ .env; không có file .env vẫn chạy được
    env_file:
      - path: .env
        required: false
    environment:
      # Lấy từ biến shell hoặc file .env (compose tự đọc .env để thay ${...}); không ghi key vào file này
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      # Ghi đè mọi giá trị trong .env: trong mạng compose, Redis ở host "redis"
      REDIS_URL: redis://redis:6379/0
      # Cổng trong container phải khớp với phần map "8000:8000"
      PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
