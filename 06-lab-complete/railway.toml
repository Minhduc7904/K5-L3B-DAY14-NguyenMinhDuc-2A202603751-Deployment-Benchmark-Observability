# ============================================================
# Cấu hình deploy Railway
#
# Trên Railway, đặt các biến này trong tab Variables (KHÔNG ghi giá trị thật vào file):
#   AGENT_API_KEY, ENVIRONMENT=production, RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD
#   REDIS_URL = ${{Redis.REDIS_URL}}   (thêm Redis plugin vào project)
# Railway tự cấp biến PORT; Dockerfile đã lắng nghe theo ${PORT:-8000}.
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
